services:
  stirling-pdf:
    build:
      context: ../..
      dockerfile: docker/embedded/Dockerfile
      args:
        STIRLING_FLAVOR: core
        BUILD_PORTAL: "false"
    container_name: personal-pdf-engine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080$${SYSTEM_ROOTURIPATH:-''}/api/v1/info/status | grep -q 'UP'"]
      interval: 5s
      timeout: 10s
      retries: 16
      start_period: 30s
    # Keep the unauthenticated personal engine reachable only from the host.
    # Attach the Laravel container to personal-pdf-network for private service-to-service access.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../../stirling/latest/data:/usr/share/tessdata:rw
      - ../../stirling/latest/config:/configs:rw
      - ../../stirling/latest/logs:/logs:rw
    environment:
      DISABLE_ADDITIONAL_FEATURES: "true"
      SECURITY_ENABLELOGIN: "false"
      STIRLING_FEATURES_DIGITAL_SIGNATURE_ENABLED: "false"
      SYSTEM_DEFAULTLOCALE: tr-TR
      UI_APPNAME: Personal PDF Engine
      UI_HOMEDESCRIPTION: Self-hosted personal PDF processing engine
      UI_APPNAMENAVBAR: Personal PDF Engine
      SYSTEM_MAXFILESIZE: "100"
      METRICS_ENABLED: "false"
      SYSTEM_GOOGLEVISIBILITY: "false"
      SHOW_SURVEY: "false"
    networks:
      - stirling-network

networks:
  stirling-network:
    name: personal-pdf-network
    driver: bridge
